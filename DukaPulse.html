<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column app shell. Gradient hero, sticky pill navigation, then a swappable page view. Reels are a phone-shaped vertical feed. */
:root{
  --font-display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --font-body:'Figtree','Avenir Next','Segoe UI',system-ui,sans-serif;
  --bg:#EEF4F0; --surface:#FFFFFF; --surface-2:#E3EDE7; --fg:#0E1F18; --muted:#566860; --line:#D2DED7;
  --primary:#007A4D; --on-primary:#FFFFFF; --accent-text:#00704A;
  --tint:rgba(0,168,107,.10); --tint-strong:rgba(0,168,107,.22);
  --gold:#FFC72C; --like:#FF3B6B;
  --warn-bg:#FFF2CC; --warn-fg:#664A00; --err-bg:#FCE4E4; --err-fg:#8A1F1F; --ok-bg:#DCF3E7; --ok-fg:#0B5A3A;
  --hero-1:#0B3D2E; --hero-2:#00A86B; --hero-3:#FFC72C;
  --shadow:0 1px 2px rgba(14,31,24,.06),0 10px 28px rgba(14,31,24,.07);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#07120D; --surface:#0F211A; --surface-2:#16291F; --fg:#E6F2EB; --muted:#93A99D; --line:#1F382D;
    --primary:#22C788; --on-primary:#03150D; --accent-text:#3EDC9B;
    --tint:rgba(34,199,136,.12); --tint-strong:rgba(34,199,136,.26);
    --warn-bg:#3A2F0A; --warn-fg:#FFD86B; --err-bg:#3A1515; --err-fg:#FF9D9D; --ok-bg:#0F3624; --ok-fg:#7BE8B4;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#07120D; --surface:#0F211A; --surface-2:#16291F; --fg:#E6F2EB; --muted:#93A99D; --line:#1F382D;
  --primary:#22C788; --on-primary:#03150D; --accent-text:#3EDC9B;
  --tint:rgba(34,199,136,.12); --tint-strong:rgba(34,199,136,.26);
  --warn-bg:#3A2F0A; --warn-fg:#FFD86B; --err-bg:#3A1515; --err-fg:#FF9D9D; --ok-bg:#0F3624; --ok-fg:#7BE8B4;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.app{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:14px 96px}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:1.45rem;font-weight:800}
h3{font-size:1.15rem;font-weight:800}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
small,.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* hero */
.hero{border-radius:22px;padding:18px 20px;color:#fff;background:linear-gradient(115deg,var(--hero-1) 0%,var(--hero-2) 62%,var(--hero-3) 135%);box-shadow:var(--shadow);display:grid;gap:6px}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:800;font-size:2rem;letter-spacing:-.025em}
.logo svg{width:30px;height:30px;color:var(--hero-3)}
.hero p{max-width:46ch;opacity:.96}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pill{background:rgba(0,0,0,.26);border-radius:999px;padding:3px 11px;font-size:.78rem;font-weight:600}
.seg{display:inline-flex;background:rgba(0,0,0,.3);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:#fff;padding:5px 13px;border-radius:999px;font-weight:600;font-size:.82rem}
.seg button[aria-pressed="true"]{background:#fff;color:#0B3D2E}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px 10px}
.nav-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.nav-row::-webkit-scrollbar{display:none}
.nav-row button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:.88rem;white-space:nowrap}
.nav-row button[aria-current="page"]{background:var(--primary);color:var(--on-primary);border-color:transparent}

/* controls */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:600;line-height:1.2}
.btn.primary{background:var(--primary);border-color:transparent;color:var(--on-primary)}
.btn.block{width:100%}
.btn.sm{padding:6px 12px;font-size:.84rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;color:var(--accent-text);font-weight:600;padding:4px 0}
.field{display:grid;gap:4px;min-width:0}
.field>label,.lbl{font-size:.82rem;color:var(--muted);font-weight:600}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
.row{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.stack{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:8px;min-width:0}
.note{border-radius:12px;padding:10px 12px;font-size:.9rem}
.note.ok{background:var(--ok-bg);color:var(--ok-fg)}
.note.warn{background:var(--warn-bg);color:var(--warn-fg)}
.note.err{background:var(--err-bg);color:var(--err-fg)}
.escrow{border:1px solid var(--tint-strong);background:var(--tint);border-radius:14px;padding:12px 14px;font-size:.9rem}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:9px 12px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--accent-text);border-bottom-color:var(--primary)}
.toggle{display:flex;align-items:center;gap:8px;font-weight:600}
.toggle input{width:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipx{background:var(--tint);color:var(--accent-text);border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:600}

/* badges */
.vb{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.b-gold{background:#FFC72C;color:#3D2C00}
.b-silver{background:#C9D2DA;color:#1D2A33}
.b-bronze{background:#E5A869;color:#3A1F05}
.b-none{background:var(--surface-2);color:var(--muted)}

/* reels */
.stage{display:grid;place-items:center}
.feed{width:min(100%,380px);height:560px;height:clamp(480px,72svh,640px);overflow-y:auto;scroll-snap-type:y mandatory;border-radius:26px;background:#000;box-shadow:var(--shadow);scrollbar-width:none;overscroll-behavior:contain}
.feed::-webkit-scrollbar{display:none}
.reel{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;color:#fff}
.poster{position:absolute;inset:0;display:grid;place-items:center;font-size:150px;line-height:1;padding-bottom:90px;animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) scale(1.03)}}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.4) 0%,rgba(0,0,0,0) 28%,rgba(0,0,0,0) 44%,rgba(0,0,0,.86) 100%)}
.brand{position:absolute;top:14px;left:14px;display:flex;align-items:center;gap:6px;font-family:var(--font-display);font-weight:800;background:rgba(0,0,0,.45);padding:6px 12px;border-radius:999px;font-size:.88rem}
.brand svg{width:16px;height:16px;color:var(--gold)}
.rec{position:absolute;top:18px;right:16px;display:flex;align-items:center;gap:6px;font-size:.72rem;font-weight:700;background:rgba(0,0,0,.45);padding:5px 10px;border-radius:999px}
.rec i{width:7px;height:7px;border-radius:50%;background:#FF4D4D;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
.rail{position:absolute;right:12px;bottom:158px;display:grid;gap:14px;justify-items:center}
.rail span{display:block;font-size:.72rem;text-align:center;margin-top:3px;font-weight:700}
.rb{border:0;background:rgba(0,0,0,.45);color:#fff;width:50px;height:50px;border-radius:50%;display:grid;place-items:center}
.rb svg{width:24px;height:24px}
.rb.on{background:var(--like)}
.rb:active{transform:scale(1.2)}
.info{position:absolute;left:14px;right:78px;bottom:22px;display:grid;gap:3px}
.sup{font-weight:700;font-size:.95rem}
.vb2{background:var(--gold);color:#222;border-radius:999px;font-size:.66rem;padding:2px 8px;font-weight:800;margin-left:6px}
.ttl{font-family:var(--font-display);font-size:1.35rem;font-weight:800;line-height:1.1}
.price{font-size:1.1rem;font-weight:800;color:var(--gold)}
.save{display:inline-block;background:#00C27A;color:#022;border-radius:999px;font-size:.7rem;font-weight:800;padding:3px 9px;margin-left:6px}
.sub{font-size:.8rem;opacity:.92}
.chip{display:inline-block;background:rgba(255,255,255,.2);border-radius:999px;padding:3px 9px;font-size:.7rem;margin:4px 4px 0 0;font-weight:600}
.hint{position:absolute;bottom:5px;left:0;right:0;text-align:center;font-size:.66rem;opacity:.7}
.prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.25)}
.prog i{display:block;height:100%;background:#fff;width:0;animation:fill 9s linear infinite}
@keyframes fill{to{width:100%}}

/* market */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{width:100%;height:84px;border-radius:12px;display:grid;place-items:center;font-size:2.6rem}
.pname{font-weight:700;line-height:1.2}
.pprice{font-family:var(--font-display);font-size:1.3rem;font-weight:800;color:var(--accent-text)}
.vid{height:150px;border-radius:16px;display:grid;place-items:center;position:relative;overflow:hidden;font-size:4.5rem;color:#fff}
.vid b{position:absolute;bottom:10px;left:12px;font-size:.78rem;background:rgba(0,0,0,.45);padding:4px 10px;border-radius:999px;font-weight:600}
.stepper{display:grid;grid-template-columns:48px 1fr 48px;gap:8px}
.stepper button{border:1px solid var(--line);background:var(--surface);border-radius:12px;font-size:1.3rem;font-weight:700}
.stepper input{text-align:center;font-weight:700;font-size:1.1rem}
.calc{display:grid;gap:14px;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.tier{position:relative;display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);overflow:hidden;isolation:isolate;margin-bottom:6px}
.tier i{position:absolute;inset:0 auto 0 0;background:var(--tint);z-index:-1}
.tier.on{border-color:var(--primary);font-weight:700}
.tier.on i{background:var(--tint-strong)}
.sumrow{display:flex;justify-content:space-between;gap:10px;padding:4px 0}
.sumtotal{display:flex;justify-content:space-between;gap:10px;padding-top:10px;margin-top:6px;border-top:2px dashed var(--line);font-size:1.2rem;font-weight:800;font-family:var(--font-display)}
.save-txt{color:var(--accent-text);font-weight:700}

/* suppliers */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:10px}
.metrics div{display:grid;gap:0}
.metrics b{font-family:var(--font-display);font-size:1.25rem}
.metrics small{font-size:.76rem}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--gold))}
details>summary{cursor:pointer;font-weight:600;padding:4px 0}
.checks{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px}

/* orders */
.tl{display:flex;align-items:center;margin:8px 0 4px}
.dot{flex:none;width:26px;height:26px;border-radius:50%;background:var(--surface-2);color:var(--muted);display:grid;place-items:center;font-size:.8rem;font-weight:700}
.dot.done{background:var(--primary);color:var(--on-primary)}
.tbar{flex:1;height:4px;background:var(--surface-2)}
.tbar.done{background:var(--primary)}
.tl-l{display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted)}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg2 button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;font-weight:700}
.seg2 button[aria-pressed="true"]{border-color:var(--primary);background:var(--tint-strong)}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}

/* progress + spinner */
.pbar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--primary);transition:width .4s}

/* chat */
.msgs{display:grid;gap:8px;max-height:360px;overflow-y:auto}
.msg{max-width:88%;padding:9px 12px;border-radius:14px;white-space:pre-wrap}
.msg.u{justify-self:end;background:var(--primary);color:var(--on-primary);border-bottom-right-radius:4px}
.msg.a{justify-self:start;background:var(--surface-2);border-bottom-left-radius:4px}
.send{display:grid;grid-template-columns:1fr auto;gap:8px}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.88rem;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:560px){
  .calc{grid-template-columns:minmax(0,1fr)}
  .row.r3{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){
  .poster,.rec i{animation:none}
  .prog i{animation:none;width:35%}
  #toast{transition:none}
}
</style>

  steps.forEach((x,i)=>{const done=i<=idx;d+=`<div class="dot${done?' done':''}">${done?'✓':i+1}</div>`;if(i<2)d+=`<div class="tbar${i<idx?' done':''}"></div>`;l+=`<span>${x}</span>`});
  return `<div class="tl">${d}</div><div class="tl-l">${l}</div>`;
}

      ${S.confirming?'<div class="pbar"><i style="width:100%"></i></div><small>Confirming with the network...</small>':`

  return `<div class="card"><div><b>${esc(o.item)}</b> · <code>${o.ref}</code></div>
    <div>${N(o.qty)} ${esc(o.unit)} · ${UG(ordTotal(o))} · ${esc(s.name)} · via ${esc(o.source)}</div>${body}
    <small>${o.net} · ${o.phone} · ref ${o.txn} · updated ${o.updated}</small>
    ${acts.length?`<div class="chips">${acts.join('')}</div>`:''}
    ${o.status==='Disputed'?'<small>Demo controls: in production a DukaPulse mediator decides.</small>':''}</div>`;
}
function viewOrders(){
  const last=S.last?`<div class="note ok" style="margin-bottom:12px">Order <b>${S.last}</b> is paid and secured in escrow. The supplier has been notified.</div>`:'';
  return `${checkoutHTML()}${last}<div class="stack">
    <h2>${S.role==='Buyer'?'My orders':'Incoming orders'}</h2>
    ${S.orders.map(orderCard).join('')||'<div class="note warn">No orders yet. Find something in Reels or Market.</div>'}
    <details class="card"><summary>Escrow ledger</summary><div class="scroll-x"><table><thead><tr><th>Time</th><th>Order</th><th>Event</th><th>Amount (UGX)</th><th>Note</th></tr></thead><tbody>
      ${S.ledger.map(l=>`<tr><td>${l.t}</td><td>${l.ref}</td><td>${l.event}</td><td class="num">${N(l.amount)}</td><td>${esc(l.note)}</td></tr>`).join('')}</tbody></table></div></details></div>`;
}
function startCheckout(cart){S.cart=cart;S.stage='details';S.err='';S.busy=null;S.last=null;go('orders')}
function normPhone(v){let d=(v||'').replace(/\D/g,'');if(d.startsWith('256')&&d.length===12)d='0'+d.slice(3);return /^0\d{9}$/.test(d)?d:null}
function ledger(o,event,amount,note){S.ledger.unshift({t:clock(),ref:o.ref,event,amount,note})}

/* ---------- Pulse AI ---------- */
const QUICK=['Which product gives me the best margin if I resell at a 15% markup?','Draft an RFQ for 100 cartons of bottled water for a school canteen.','How does escrow protect me when buying from a new supplier?'];
function aiReply(q){
  const t=q.toLowerCase();
  if(/margin|markup|profit/.test(t))return 'A 15% markup gives the same margin percentage on every product, so compare profit per unit and volume instead.\n\nAt the 60-bag tier, rice costs UGX 168,000 and a 15% markup earns about UGX 25,200 per bag. Bottled water at the 100-carton tier costs UGX 11,800 and earns about UGX 1,770 per carton, so volume matters more there.';
  if(/rfq|draft|quote/.test(t))return 'Looking for 100 cartons (24 × 500ml) of bottled water for a school canteen in Entebbe. Target price is UGX 11,500 per carton, delivered weekly for one term, with an invoice per delivery. Please quote your best unit price, lead time and delivery terms by Sunday.';
  if(/escrow|protect|safe/.test(t))return 'When you pay, DukaPulse holds the money instead of sending it to the supplier. The supplier ships, you confirm delivery, and only then is the money released. If something is wrong you raise a dispute and the funds stay frozen until it is reviewed.';
  return 'In the live app this answer comes from Gemini. This preview only has scripted replies for the three suggested prompts.';
}
function chatHTML(){return S.chat.map(m=>`<div class="msg ${m.r}">${esc(m.c)}</div>`).join('')}
function viewAi(){
  return `<div class="stack"><h2>Pulse AI</h2><p class="muted">Autonomous, high-performance multimodal intelligence for your trade questions.</p>
   <div class="card">
    ${S.chat.length?'':`<small>Try one:</small><div class="stack">${QUICK.map(q=>`<button class="btn" style="text-align:left;border-radius:14px" data-act="quick" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>`}
    <div class="msgs" id="msgs">${chatHTML()}</div>
    <div class="send"><input id="aiq" placeholder="What would you like Pulse AI to conquer today?"><button class="btn primary" data-act="ask">Send</button></div>
   </div></div>`;
}
function ask(text){
  text=(text||'').trim();if(!text)return;
  S.chat.push({r:'u',c:text});S.chat.push({r:'a',c:'Pulse AI is computing...'});
  const idx=S.chat.length-1;render();
  setTimeout(()=>{S.chat[idx]={r:'a',c:aiReply(text)};if(S.page==='ai'){const m=$('#msgs');if(m){m.innerHTML=chatHTML();m.scrollTop=m.scrollHeight}}},800);
}

/* ---------- My Shop (supplier) ---------- */
function viewShop(){
  const me=sup(1),mine=PRODS.filter(p=>p.sid===1);
  return `<div class="stack"><h2>${esc(me.name)}</h2><div>${badge(me)}</div>
   <div class="card"><h3>Add a product</h3>
    <div class="field"><label for="s-name">Product name</label><input id="s-name" placeholder="e.g. Maize flour 25kg"></div>
    <div class="row r3"><div class="field"><label for="s-unit">Unit</label><input id="s-unit" value="50kg bag"></div><div class="field"><label for="s-moq">Minimum order (MOQ)</label><input id="s-moq" type="number" min="1" value="5"></div></div>
    <div class="row"><div class="field"><label for="s-base">Price per unit at MOQ (UGX)</label><input id="s-base" type="number" min="1" step="500" value="10000"></div><div class="field"><label for="s-stock">Stock available</label><input id="s-stock" type="number" min="1" value="100"></div></div>
    <span class="lbl">Bigger orders get lower prices (optional)</span>
    <div class="row"><div class="field"><label for="s-q2">Tier 2: from quantity</label><input id="s-q2" type="number" min="0" value="20"></div><div class="field"><label for="s-p2">Tier 2: price per unit</label><input id="s-p2" type="number" min="0" step="500" value="9500"></div></div>
    <div class="row"><div class="field"><label for="s-q3">Tier 3: from quantity</label><input id="s-q3" type="number" min="0" value="0"></div><div class="field"><label for="s-p3">Tier 3: price per unit</label><input id="s-p3" type="number" min="0" step="500" value="0"></div></div>
    <div class="field"><label for="s-vid">Video reel link (direct .mp4) or upload a short clip</label><input id="s-vid" placeholder="https://.../clip.mp4"></div>
    <div id="s-err"></div><button class="btn primary" data-act="addProd">Publish product</button></div>
   <div class="card"><h3>My products</h3>${mine.map(p=>`<div class="sumrow"><span>${p.e} <b>${esc(p.name)}</b><br><small>MOQ ${p.moq} · stock ${N(p.stock)} · ${p.tiers.map(([m,x])=>N(m)+'+ → '+N(x)).join(' | ')}</small></span><button class="btn sm" data-act="delProd" data-id="${p.id}">Remove</button></div>`).join('')||'<small>No products yet.</small>'}</div>
   <div class="card"><h3>Verification</h3><div class="bar"><i style="width:${score(me)}%"></i></div><small>Trust score ${score(me)}/100. In the live demo each submission is approved instantly.</small>
    ${CHECKS.map(([l,w],i)=>`<div class="sumrow"><span>${me.v[i]?'✅':'⬜'} ${l} (+${w})</span>${me.v[i]?'':`<button class="btn sm" data-act="verify" data-i="${i}">Submit for review</button>`}</div>`).join('')}</div></div>`;
}

const VIEWS={reels:viewReels,market:viewMarket,rfq:viewRfq,sup:viewSup,orders:viewOrders,ai:viewAi,shop:viewShop};

/* ---------- actions ---------- */
const A={
 nav:d=>go(d.p,d.p==='market'?{pid:null}:{}),
 role:d=>{S.role=d.r;if(S.role==='Buyer'&&S.page==='shop')S.page='reels';renderNav();render()},
 like:(d,t)=>{const id=+d.id,p=prod(id);S.liked[id]=!S.liked[id];t.classList.toggle('on',S.liked[id]);t.parentElement.querySelector('span').textContent=N(p.likes+(S.liked[id]?1:0))},
 share:()=>toast('The share sheet opens here in the live app'),
 reelBuy:()=>{const id=+$('#reelPick').value;S.qty=prod(id).moq;go('market',{pid:id})},
 reelSup:()=>{const id=+$('#reelPick').value;go('sup',{onlyVer:false})},
 open:d=>{const p=prod(+d.id);S.qty=p.moq;S.pid=p.id;render();window.scrollTo(0,0)},
 back:()=>{S.pid=null;render()},
 clearSup:()=>{S.supFilter=null;render()},
 qd:d=>setQty(S.qty+(+d.d)),
 setq:d=>setQty(+d.q),
 buyNow:()=>{const p=prod(S.pid);startCheckout({sid:p.sid,item:p.name,qty:S.qty,unit:p.unit,price:priceFor(p,S.qty),source:'Marketplace'})},
 rfqTab:d=>{S.rfqTab=d.t;render()},
 accept:d=>{const r=S.rfqs.find(x=>x.id==d.r),q=r.quotes.find(x=>x.sid==d.s);q.accepted=true;r.status='Awarded';startCheckout({sid:q.sid,item:r.title,qty:r.qty,unit:r.unit,price:q.price,source:'RFQ #'+r.id})},
 postRfq:()=>{
  const g=id=>$('#'+id).value.trim(),title=g('f-title'),loc=g('f-loc');
  if(!title||!loc){$('#f-err').innerHTML='<div class="note err">Please add a title and a delivery location.</div>';return}
  S.rfqs.unshift({id:S.rfqs.length+1,buyer:'Guest Buyer',title,cat:g('f-cat'),qty:+g('f-qty')||1,unit:g('f-unit'),target:+g('f-target')||0,loc,deadline:g('f-dl'),details:g('f-det'),status:'Open',quotes:[]});
  S.rfqTab='open';render();toast('RFQ posted. Verified suppliers can quote now.');
 },
 sendQuote:d=>{
  const r=S.rfqs.find(x=>x.id==d.r),price=+$('#qp'+r.id).value,lead=+$('#ql'+r.id).value||0;
  if(!price)return;r.quotes.push({sid:1,price,lead,note:$('#qn'+r.id).value.trim()});render();toast('Quote sent to the buyer');
 },
 browse:d=>go('market',{pid:null,supFilter:+d.s,q:'',cat:'All'}),
 newSup:()=>{
  const name=$('#n-name').value.trim(),city=$('#n-city').value.trim(),ph=normPhone($('#n-phone').value);
  if(!name||!city||!ph){$('#n-err').innerHTML='<div class="note err">Please add a business name, city and a valid Ugandan phone number.</div>';return}
  SUPS.push({id:SUPS.length+1,name,city,cat:'Other',years:1,owner:'You',rating:0,orders:0,resp:24,phone:ph,v:[0,0,0,0,0],bio:'New supplier profile.'});
  render();toast('Supplier profile created');
 },
 net:d=>{S.net=d.n;S.err='';S.phone=$('#phone')?$('#phone').value:S.phone;render()},
 cancelCo:()=>{S.cart=null;render()},
 prompt:()=>{
  S.phone=$('#phone').value;const p=normPhone(S.phone);
  if(!p){S.err='Enter a valid Ugandan number, e.g. 0771234567.';return render()}
  if(!NETS[S.net].includes(p.slice(0,3))){S.err=`That number doesn't look like an ${S.net} line. Check the number or switch network.`;return render()}
  S.err='';S.busy=10;render();
  const c=S.cart,sub=c.price*c.qty,fee=Math.round(sub*FEE/100);
  const steps=[[30,`Contacting ${S.net}...`],[65,`Sending prompt to ${p}...`],[100,'Prompt delivered. Check your phone.']];
  steps.forEach(([pct,msg],i)=>setTimeout(()=>{
    if(S.busy===null)return;
    const b=$('.pbar i'),t=$('#busytxt');if(b)b.style.width=pct+'%';if(t)t.textContent=msg;
    if(i===2)setTimeout(()=>{S.busy=null;S.pay={net:S.net,phone:p,total:sub+fee+S.delivery,sub,fee};S.stage='pin';S.err='';render()},500);
  },500*(i+1)));
 },
 changeNum:()=>{S.stage='details';S.err='';render()},
 approve:()=>{
  if(!/^\d{4,5}$/.test($('#pin').value)){S.err='PIN must be 4 or 5 digits.';return render()}
  S.err='';S.confirming=true;render();
  setTimeout(()=>{
    const c=S.cart,ref='DP-'+Math.random().toString(36).slice(2,8).toUpperCase(),txn='MP'+Math.floor(Math.random()*9e9+1e9);
    const o={id:S.orders.length+1,ref,sid:c.sid,item:c.item,qty:c.qty,unit:c.unit,price:c.price,delivery:S.delivery,net:S.pay.net,phone:S.pay.phone,txn,status:'In Escrow',source:c.source,updated:'Today '+clock()};
    S.orders.unshift(o);ledger(o,'escrow_hold',ordTotal(o),`${o.net} ${txn} held by DukaPulse`);
    S.cart=null;S.stage='details';S.confirming=false;S.last=ref;S.delivery=0;
    if(S.page==='orders')render();toast('Payment secured in escrow');
  },1100);
 },
 oa:d=>{
  const o=S.orders.find(x=>x.id==d.o),a=d.a;
  if(a==='ship'&&o.status==='In Escrow')o.status='Shipped';
  else if(a==='release'&&o.status==='Shipped'){o.status='Released';ledger(o,'escrow_release',ordSub(o)+o.delivery,'Released to supplier on buyer confirmation');ledger(o,'platform_fee',ordFee(o),'DukaPulse escrow fee')}
  else if(a==='dispute'){o.status='Disputed';ledger(o,'dispute_opened',0,'Funds frozen pending review')}
  else if(a==='refund'){o.status='Refunded';ledger(o,'escrow_refund',ordTotal(o),'Refunded to buyer')}
  else if(a==='paysup'){o.status='Released';ledger(o,'escrow_release',ordSub(o)+o.delivery,"Dispute resolved in supplier's favour");ledger(o,'platform_fee',ordFee(o),'DukaPulse escrow fee')}
  o.updated='Today '+clock();render();
 },
 quick:d=>ask(d.q),
 ask:()=>{const i=$('#aiq');const v=i.value;i.value='';ask(v)},
 addProd:()=>{
  const g=id=>$('#'+id).value.trim(),name=g('s-name'),moq=+g('s-moq'),base=+g('s-base');
  const tiers=[[moq,base]];[['s-q2','s-p2'],['s-q3','s-p3']].forEach(([a,b])=>{if(+g(a)&&+g(b))tiers.push([+g(a),+g(b)])});
  let ok=!!name&&moq>0&&base>0;for(let i=1;i<tiers.length;i++)if(tiers[i][0]<=tiers[i-1][0]||tiers[i][1]>=tiers[i-1][1])ok=false;
  if(!ok){$('#s-err').innerHTML='<div class="note err">Add a name, and make sure each tier has a higher quantity and a lower price than the one before.</div>';return}
  PRODS.push({id:Math.max(...PRODS.map(p=>p.id))+1,sid:1,name,cat:'Groceries',e:'📦',unit:g('s-unit'),moq,stock:+g('s-stock')||1,likes:0,desc:'New product from '+sup(1).name+'.',tiers});
  render();toast('Published! It now appears in Reels and Market.');
 },
 delProd:d=>{PRODS=PRODS.filter(p=>p.id!==+d.id);render()},
 verify:d=>{sup(1).v[+d.i]=1;render();toast('Check approved (instant in the demo)')}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t&&A[t.dataset.act]){e.preventDefault();A[t.dataset.act](t.dataset,t)}});
document.addEventListener('input',e=>{
  const i=e.target.id;
  if(i==='qty')setQty(e.target.value);
  else if(i==='mq'){S.q=e.target.value;$('#grid').innerHTML=gridHTML()}
});
document.addEventListener('change',e=>{
  const i=e.target.id;
  if(i==='mc'){S.cat=e.target.value;$('#grid').innerHTML=gridHTML()}
  else if(i==='dlv'){S.delivery=+e.target.value;render()}
  else if(i==='onlyVer'){S.onlyVer=e.target.checked;render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='aiq'){e.preventDefault();A.ask()}});

renderNav();render();
</script>

</body></html>
